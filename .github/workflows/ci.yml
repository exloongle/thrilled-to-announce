name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Hygiene, Golden Eval & Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Enforce zero print calls via Python AST gate
        run: |
          python - << 'PY'
          import ast
          import pathlib
          import sys

          violations = []
          for pkg in ("thrilled_to_announce", "server", "eval", "tests"):
              if not pathlib.Path(pkg).exists():
                  continue
              for py_file in sorted(pathlib.Path(pkg).rglob("*.py")):
                  tree = ast.parse(py_file.read_text(encoding="utf-8"), filename=str(py_file))
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Call) and (
                          (isinstance(node.func, ast.Name) and node.func.id == "print")
                          or (isinstance(node.func, ast.Attribute) and node.func.attr == "print")
                      ):
                          violations.append(f"{py_file}:{node.lineno}")
          if violations:
              sys.stderr.write("Forbidden stdout call(s) found:\n" + "\n".join(violations) + "\n")
              sys.exit(1)
          sys.stdout.write("AST structured-logging gate passed.\n")
          PY

      - name: Enforce secret and repository hygiene gate
        run: |
          python - << 'PY'
          import os
          import pathlib
          import re
          import sys

          skip_dirs = {
              ".git",
              ".venv",
              "venv",
              "__pycache__",
              ".pytest_cache",
              ".ruff_cache",
              ".mypy_cache",
              ".thrilled_data",
              ".terraform",
          }
          forbidden_files = {".env", "uv.lock", "terraform.tfstate"}
          patterns = [
              ("google_api_key", re.compile(r"AIza[0-9A-Za-z_-]" + r"{35}")),
              ("github_token", re.compile(r"\bgh[pousr]_[A-Za-z0-9]" + r"{30,}")),
              ("openai_or_anthropic_key", re.compile(r"\bsk-(?:proj-|ant-)?[A-Za-z0-9_-]" + r"{20,}")),
              ("slack_token", re.compile(r"\bxox[abpr]-[A-Za-z0-9-]" + r"{10,}")),
              ("pem_key", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRI" + r"VATE KEY-----")),
              ("sa_json_key", re.compile(r'"ty' + r'pe"\s*:\s*"service_account"')),
              ("proxy_lock_url", re.compile(r"https?://[^\s\"']+:999/python/")),
          ]

          issues = []
          for dirpath, dirnames, filenames in os.walk("."):
              dirnames[:] = [d for d in dirnames if d not in skip_dirs]
              for fname in filenames:
                  fpath = pathlib.Path(dirpath) / fname
                  is_forbidden_name = (
                      fname in forbidden_files
                      or (fname.startswith(".env.") and fname != ".env.example")
                      or ".tfstate." in fname
                      or fname.endswith((".pem", ".key", ".tfvars", ".tfvars.json", ".tfstate"))
                  )
                  if is_forbidden_name:
                      issues.append(f"Forbidden file present: {fpath}")
                      continue
                  try:
                      content = fpath.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for label, rx in patterns:
                      if rx.search(content):
                          issues.append(f"{label} matched in {fpath}")
          if issues:
              sys.stderr.write("Hygiene gate failed:\n" + "\n".join(issues) + "\n")
              sys.exit(1)
          sys.stdout.write("Secret and leak hygiene gate passed.\n")
          PY

      - name: Run pytest unit and integration suite
        run: pytest

      - name: Run 26-case golden evaluation suite and ADK test_config thresholds
        run: python -m eval.run_eval

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate Terraform formatting and HCL schema
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
