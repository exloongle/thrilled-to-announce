[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thrilled-to-announce"
version = "0.1.0"
description = "Clean LinkedIn-style conversational agent that auto-detects and converts between plain human thoughts and LinkedIn announcements, built with Google ADK."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "google-cloud-secret-manager>=2.21.0",
    "google-cloud-dlp>=3.23.0",
    "google-cloud-modelarmor>=0.2.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
cloud-db = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "pyyaml>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["thrilled_to_announce", "server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".thrilled_data",
    "terraform",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
